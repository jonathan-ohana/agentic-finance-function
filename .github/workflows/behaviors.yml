name: Behavior judge

# The judge layer's own checks. Standard library only, so no job here installs anything.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec-hygiene:
    # Five required fields, a known severity, unique IDs, no figures or instance names, and
    # a rationale that cites a repository path that exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every behavior spec is well formed and traces to a correction
        run: python package/judge.py --specs package/behaviors --check-specs

  leakage:
    # The charter/rubric separation is the whole design. Fails if a behavior ID or a spec's
    # condition or expectation text appears in anything an agent reads. Every top-level
    # Markdown file is scanned by glob; a new topic folder holding write-ups must be added here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No spec text in any agent-facing file
        run: |
          python package/judge.py --specs package/behaviors --check-leakage \
            *.md agents plugins \
            architecture contracts correction-loop data install outputs playbooks \
            red-team runs semantic-layer what-broke

  judge-fixture:
    # The seed pack. Passes only if exactly the planted failures are FALSE: a missed seed
    # means the judge is broken, an extra FALSE means the judge or the specs changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The trajectory fixture is well formed
        run: python package/trajectory.py validate tests/fixtures/run-fanout.jsonl
      - name: The judge finds exactly the planted failures
        run: |
          python package/judge.py --specs package/behaviors \
            --run tests/fixtures/run-fanout.jsonl \
            --expect-false B-ANL-001,B-ANL-003 --out verdict-sheet.md
      - name: Show the verdict sheet
        if: always()
        run: cat verdict-sheet.md || true
      - name: A FALSE a shell step could have caused carries the recorder caveat
        # The recorder cannot see what a shell command reads. The map must say so, and a FALSE on
        # reads or step order must carry the caveat, or a recorder blind spot reads as agent failure.
        run: |
          python package/trajectory.py validate tests/fixtures/run-opaque.jsonl
          python package/judge.py --specs package/behaviors \
            --run tests/fixtures/run-opaque.jsonl \
            --expect-false B-ANL-001,B-ANL-004 --out opaque-sheet.md
          grep -q "Recorder limitation (unobserved_reads)" opaque-sheet.md
          test "$(grep -c 'CAVEAT: 1 earlier shell step' opaque-sheet.md)" -eq 2

  canonicity:
    # Which write-up is the current word on its subject. Runs with --allow-unclassified while
    # the owner classifies the tree: unclassified documents are reported, not failed, but
    # dangling successors, asymmetric relations, superseded records, cycles, stale references
    # and duplicate numbers gate from now on. The flag comes off in its own change, when the
    # owner says classification is complete.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every relation between documents holds
        run: python package/canonicity.py --allow-unclassified --export
      - name: The register must be the one this tree was committed with
        run: git diff --exit-code outputs/canon-register.md
      - name: The judge must know every superseded document
        # --export rewrites the judge config's superseded list from the tags. A diff here means
        # a document was tagged superseded and the export was not committed with it, so the
        # judge would still grade reads of it as canonical.
        run: git diff --exit-code package/behaviors/judge-config.json
